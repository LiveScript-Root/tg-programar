name: publicar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Solo mostrar, no enviar"
        type: boolean
        default: false
      ignorar_hora:
        description: "Listar todo sin mirar la hora"
        type: boolean
        default: true

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar vencidos
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SEGUNDOS: "1.5"
        run: python nube.py ${{ inputs.simular && '--simular' || '' }} ${{ inputs.ignorar_hora && '--ignorar-hora' || '' }}
      - name: Preparar git
        run: |
          set -x
          git remote -v
          git status --short
          git branch -vv
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
      - name: Commit estado
        run: |
          set -x
          git add estado.json
          git commit -m "estado $(date -u +%F_%T)" || echo "sin cambios"
      - name: Push estado
        run: |
          set -x
          git pull --rebase origin main
          git push origin HEAD:main
