name: publicar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Solo mostrar, no enviar"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar vencidos
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SEGUNDOS: "1.5"
        run: python nube.py ${{ inputs.simular && '--simular' || '' }}
      - name: Guardar estado
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet && echo "sin cambios" || git commit -m "estado $(date -u +%F_%T)"
          git pull --rebase --autostash
          git push
